sonar.projectKey=ciddan_alloy-di
sonar.organization=ciddan

sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,packages/alloy/tests/fixture-lib/**,packages/examples/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The Jest and node:test adapters are thin runner-binding wrappers verified by
# integration tests under their own runners (src/runner-tests). The coverage
# pipeline only instruments Vitest, so their execution isn't captured; exclude
# them from coverage (still analyzed for bugs/smells). The Vitest adapter is
# covered normally.
sonar.coverage.exclusions=packages/testing/src/adapters/jest.ts,packages/testing/src/adapters/node.ts

# S4790 (weak hash algorithms): build-time plugin code uses hashes for cache
# keys and identifier disambiguation only, never in a security context.
sonar.issue.ignore.multicriteria=weakHashInPlugins
sonar.issue.ignore.multicriteria.weakHashInPlugins.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.weakHashInPlugins.resourceKey=packages/alloy/src/plugins/**
